environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0

  # Location
