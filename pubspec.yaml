flutter:
  uses-material-design: true

One change from your original file is go_router: the current stable release is 18.0.1, rather than the older 14.6.2.
  
  Your resulting architecture
  abc
  │
  ├── Riverpod 3
  │   ├── flutter_riverpod
  │   ├── riverpod_annotation
  │   └── riverpod_generator
  │
  ├── Navigation
  │   └── go_router
  │
  ├── Firebase
  │   ├── firebase_core
  │   └── firebase_database
  │
  ├── API
  │   ├── dio
  │   ├── pretty_dio_logger
  │   └── connectivity_plus
  │
  ├── Maps
  │   └── maplibre_gl
  │
  ├── Models
  │   ├── freezed
  │   └── json_serializable
  │
  └── Local Database
  └── Drift

After creating the project, run:

  flutter pub get

And when you start using Riverpod/Freezed/JSON generation:

  dart run build_runner build --delete-conflicting-outputs

One caveat: firebase_core, firebase_database, and maplibre_gl also require platform-specific setup beyond pubspec.yaml—especially Firebase configuration files and MapLibre's map style/tile source.